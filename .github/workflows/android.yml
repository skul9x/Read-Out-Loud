name: Android CI/CD Build & Release APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 🔑 GIẢI MÃ KHÓA: Đọc chuỗi Base64 từ Secrets và khôi phục thành file skul9x.jks nằm trong thư mục app/
    - name: Decode Keystore
      env:
        ENCODED_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        echo "$ENCODED_KEYSTORE" | base64 --decode > app/skul9x.jks

    # 🏷️ TỰ ĐỘNG TÍNH VERSION & TÊN APP: Lấy release mới nhất và slugify tên repo (vd: My App -> my-app)
    - name: Determine Next Release Version
      id: versioning
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Tự động chuyển tên Repository thành tên app viết thường phân cách bằng dấu gạch ngang '-'
        REPO_NAME="${{ github.event.repository.name }}"
        APP_NAME=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | tr '_' '-' | sed -E 's/[^a-z0-9]+/-/g' | sed -E 's/^-|-$//g')
        echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT

        LATEST_TAG=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
          "https://api.github.com/repos/${{ github.repository }}/releases/latest" | jq -r '.tag_name // empty')
        
        if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
          NEW_TAG="v1.0"
        else
          MAJOR=$(echo "$LATEST_TAG" | sed -E 's/^v?([0-9]+)\.([0-9]+).*/\1/')
          MINOR=$(echo "$LATEST_TAG" | sed -E 's/^v?([0-9]+)\.([0-9]+).*/\2/')
          
          if [ -z "$MAJOR" ] || [ -z "$MINOR" ]; then
            NEW_TAG="v1.0"
          else
            NEXT_MINOR=$((MINOR + 1))
            NEW_TAG="v${MAJOR}.${NEXT_MINOR}"
          fi
        fi
        
        echo "Selected next release tag: $NEW_TAG for app: $APP_NAME"
        echo "tag_name=$NEW_TAG" >> $GITHUB_OUTPUT

    # 🚀 BUILD & KÝ SỐ: Biên dịch bản Release và tự động ký bằng file jks vừa giải mã
    - name: Build Release APK with Gradle
      env:
        KEYSTORE_PATH: skul9x.jks
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew :app:assembleRelease

    # 🏷️ ĐỔI TÊN FILE APK: Đổi tên file APK theo chuẩn '<app-name>-v1.x.apk'
    - name: Rename Release APK
      run: |
        mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/${{ steps.versioning.outputs.app_name }}-${{ steps.versioning.outputs.tag_name }}.apk"

    # 🚀 TẠO GITHUB RELEASE VÀ UPLOAD ASSET: Tạo release tự động và upload file APK
    - name: Create Release and Upload Asset
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.versioning.outputs.tag_name }}
        name: "Release ${{ steps.versioning.outputs.tag_name }}"
        body: |
          Chào mừng đến với phiên bản **${{ steps.versioning.outputs.app_name }} ${{ steps.versioning.outputs.tag_name }}**! 🎉
          
          Phiên bản này mang tới các nâng cấp và cải tiến vượt trội.
        draft: false
        prerelease: false
        files: app/build/outputs/apk/release/${{ steps.versioning.outputs.app_name }}-${{ steps.versioning.outputs.tag_name }}.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
