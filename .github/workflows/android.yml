name: Android CI/CD Build & Release APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 🔑 GIẢI MÃ KHÓA: Đọc chuỗi Base64 từ Secrets và khôi phục thành file skul9x.jks nằm trong thư mục app/
    - name: Decode Keystore
      env:
        ENCODED_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        echo "$ENCODED_KEYSTORE" | base64 --decode > app/skul9x.jks

    # 🚀 BUILD & KÝ SỐ: Biên dịch bản Release và tự động ký bằng file jks vừa giải mã
    - name: Build Release APK with Gradle
      env:
        KEYSTORE_PATH: skul9x.jks
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew :app:assembleRelease

    # 🏷️ ĐỔI TÊN FILE APK: Đổi tên file APK thành 'Read-Out-Loud_v1.1.apk' theo đúng yêu cầu đặc tả
    - name: Rename Release APK
      run: |
        mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Read-Out-Loud_v1.1.apk

    # 🚀 TẠO GITHUB RELEASE VÀ UPLOAD ASSET: Tạo release v1.1 và upload file Read-Out-Loud_v1.1.apk
    - name: Create Release and Upload Asset
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.1
        name: "Release v1.1"
        body: |
          Chào mừng đến với phiên bản **Read-Out-Loud v1.1**! 🎉
          
          Phiên bản này mang tới các nâng cấp và cải tiến vượt trội:
          - 🔄 **Hệ thống xoay tua mô hình Gemini thế hệ mới:** Tự động xoay tua API keys và Models theo chiến lược Model-First, Key-Second thông minh.
          - 🧠 **Cơ chế tự vá lỗi (Self-Healing):** Khôi phục danh sách mô hình mặc định ngay lập tức khi danh sách trống hoặc tất cả bị vô hiệu hóa.
          - ⏳ **Độ trễ Cooldown thông minh:** Trì hoãn 300ms khi gặp lỗi 429 RPM/503 để bảo vệ tài nguyên.
          - 🔌 **Ngắt kết nối khẩn cấp:** Dừng xoay tua ngay khi phát hiện mất mạng vật lý (UnknownHostException).
          - 🎨 **Giao diện Material 3 đẳng cấp:** Hỗ trợ Dark theme, hiệu ứng Karaoke đồng bộ theo từ, tự động cuộn thông minh.
        draft: false
        prerelease: false
        files: app/build/outputs/apk/release/Read-Out-Loud_v1.1.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
